<template>
	<div class="grid">
		<template for:each={categories} for:item="category">
			<c-home-categories-card 
				key={category.id} 
				image-url={category.imageUrl} 
				image-alt={category.imageAlt}
				cta-text={category.ctaText} 
				cta-url={category.ctaUrl}>
			</c-home-categories-card>
		</template>
	</div>
</template>
