<template>
    <div class="card">
		<div class="card-body"> <!--add card-link, remove "position:absolute" from it-->
			<a href={ctaUrl} class="card-image">
				<img src={imageUrl} alt={imageAlt} />
			</a>
			<p class="label">{label}</p>
			<h3>{title}</h3>
			<p class="desc">{desc}</p>
			<div lwc:if={showPricing} class="pricing">
				<template lwc:if={price}>
					<p class="sale-price">
						<lightning-formatted-number value={price} format-style="currency" currency-code="USD"></lightning-formatted-number>
					</p>
				</template>
				<p class="price">
					<lightning-formatted-number value={salePrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
				</p>
			</div>
		</div>
		<div class="card-cta"> <!--add cursor: pointer to this class-->
			<button class="cta" type="button" disabled={ctaDisabled} onclick={handleClickCtaButton}>{ctaText}</button>
		</div>
    </div>
</template>
