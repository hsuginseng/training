<template lwc:render-mode='light'>
	<div class="accordion-item">
		<button id={index} class="accordion-toggle" onclick={handleToggle} aria-expanded="false">
			{toggle}
		</button>
		<div class="accordion-panel" role="region">
			<lightning-formatted-text value={text}></lightning-formatted-text>
			<template lwc:if={ctaUrl}>
				<a href={ctaUrl}>{ctaText}</a>
			</template>
		</div>
	</div>
</template>
